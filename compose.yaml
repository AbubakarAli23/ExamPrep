name: examprep

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-examprep}
      POSTGRES_USER: ${SPRING_DATASOURCE_USERNAME:-examprep}
      POSTGRES_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-change-me}
    volumes:
      - examprep-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Not published by default. Uncomment to inspect the database from the host.
    # ports:
    #   - "5432:5432"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-examprep}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:-examprep}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:-change-me}
      APP_STORAGE_LOCATION: /app/data/uploads
      APP_MAX_UPLOAD_SIZE_MB: ${APP_MAX_UPLOAD_SIZE_MB:-25}
      SERVER_PORT: 8080
      THYMELEAF_CACHE: "true"
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      GEMINI_REQUEST_TIMEOUT_SECONDS: ${GEMINI_REQUEST_TIMEOUT_SECONDS:-150}
      GEMINI_MAX_RETRIES: ${GEMINI_MAX_RETRIES:-2}
      GEMINI_MAX_OUTPUT_TOKENS: ${GEMINI_MAX_OUTPUT_TOKENS:-16384}
      APP_STALE_JOB_MINUTES: ${APP_STALE_JOB_MINUTES:-30}
    ports:
      - "${SERVER_PORT:-8080}:8080"
    volumes:
      - examprep-uploads:/app/data/uploads

volumes:
  examprep-db:
  examprep-uploads:
