spring:
  application:
    name: ExamPrep

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/examprep}
    username: ${SPRING_DATASOURCE_USERNAME:examprep}
    password: ${SPRING_DATASOURCE_PASSWORD:examprep}
    hikari:
      maximum-pool-size: 10

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  servlet:
    multipart:
      enabled: true
      max-file-size: ${APP_MAX_UPLOAD_SIZE_MB:25}MB
      max-request-size: ${APP_MAX_UPLOAD_SIZE_MB:25}MB
      file-size-threshold: 1MB

  thymeleaf:
    cache: ${THYMELEAF_CACHE:false}

server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework
  error:
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: 60m
      cookie:
        http-only: true
        same-site: lax

app:
  storage:
    location: ${APP_STORAGE_LOCATION:./data/uploads}
  max-upload-size-mb: ${APP_MAX_UPLOAD_SIZE_MB:25}
  processing:
    stale-job-minutes: ${APP_STALE_JOB_MINUTES:30}
  ai:
    api-key: ${GOOGLE_API_KEY:}
    model: ${GEMINI_MODEL:gemini-3.8-flash}
    request-timeout-seconds: ${GEMINI_REQUEST_TIMEOUT_SECONDS:150}
    max-retries: ${GEMINI_MAX_RETRIES:2}
    max-output-tokens: ${GEMINI_MAX_OUTPUT_TOKENS:16384}
    batch-character-limit: ${GEMINI_BATCH_CHARACTER_LIMIT:14000}
    synthesis-character-limit: ${GEMINI_SYNTHESIS_CHARACTER_LIMIT:26000}
    tutor-context-chunks: ${TUTOR_CONTEXT_CHUNKS:6}

logging:
  level:
    root: INFO
    com.examprep: INFO
    org.apache.tika: WARN
    org.apache.pdfbox: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
