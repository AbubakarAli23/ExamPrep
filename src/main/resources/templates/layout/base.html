<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head(title)">
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="|${title} · ExamPrep|">ExamPrep</title>
    <meta name="description" content="ExamPrep turns your own course documents into revision notes, flashcards, practice questions, mock examinations and a document-grounded AI tutor.">
    <meta name="_csrf" th:content="${_csrf != null ? _csrf.token : ''}">
    <meta name="_csrf_header" th:content="${_csrf != null ? _csrf.headerName : 'X-CSRF-TOKEN'}">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/mark.svg}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>

<header th:fragment="publicNavbar" class="site-header">
    <div class="wrap header-inner">
        <a class="brand" th:href="@{/}">
            <span class="brand-mark" aria-hidden="true">EP</span>
            <span class="brand-name">ExamPrep</span>
        </a>
        <nav class="primary-nav" aria-label="Primary" id="primary-nav">
            <a th:href="@{/} + '#how-it-works'">How it works</a>
            <a th:href="@{/} + '#study-tools'">Study tools</a>
            <a th:href="@{/} + '#privacy'">Privacy</a>
        </nav>
        <div class="header-actions">
            <a class="button button--secondary button--small" th:href="@{/login}">Sign in</a>
            <a class="button button--small" th:href="@{/register}">Create account</a>
            <button type="button" class="nav-toggle" data-nav-toggle aria-expanded="false" aria-controls="primary-nav">Menu</button>
        </div>
    </div>
</header>

<header th:fragment="appNavbar(active)" class="site-header">
    <div class="wrap header-inner">
        <a class="brand" th:href="@{/dashboard}">
            <span class="brand-mark" aria-hidden="true">EP</span>
            <span class="brand-name">ExamPrep</span>
        </a>
        <nav class="primary-nav" aria-label="Primary" id="primary-nav">
            <a th:href="@{/dashboard}" th:classappend="${active == 'dashboard'} ? 'is-active'">Dashboard</a>
            <a th:href="@{/documents}" th:classappend="${active == 'documents'} ? 'is-active'">Documents</a>
        </nav>
        <div class="account">
            <span class="avatar" sec:authentication="principal.initials" aria-hidden="true">S</span>
            <span class="account-name" sec:authentication="principal.fullName">Student</span>
            <form class="inline-form" th:action="@{/logout}" method="post">
                <button type="submit" class="link-button">Sign out</button>
            </form>
            <button type="button" class="nav-toggle" data-nav-toggle aria-expanded="false" aria-controls="primary-nav">Menu</button>
        </div>
    </div>
</header>

<div th:fragment="flash" class="wrap">
    <div class="flash-stack" th:if="${notice != null or uploadError != null or tutorError != null}">
        <div class="notice" role="status" th:if="${notice != null and !#strings.isEmpty(notice)}" th:text="${notice}"></div>
        <div class="alert" role="alert" th:if="${uploadError != null and !#strings.isEmpty(uploadError)}" th:text="${uploadError}"></div>
        <div class="alert" role="alert" th:if="${tutorError != null and !#strings.isEmpty(tutorError)}" th:text="${tutorError}"></div>
    </div>
</div>

<footer th:fragment="footer" class="site-footer">
    <div class="wrap footer-inner">
        <div>
            <strong>ExamPrep</strong> — a study workspace built from your own course material.
        </div>
        <div class="footer-links">
            <a th:href="@{/}">Home</a>
            <a th:href="@{/} + '#privacy'">Privacy</a>
            <span th:text="|© ${currentYear} ExamPrep|">© ExamPrep</span>
        </div>
    </div>
</footer>

<th:block th:fragment="scripts">
    <script th:src="@{/js/app.js}" defer></script>
</th:block>

</body>
</html>
